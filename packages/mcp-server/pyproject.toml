[project]
name = "reposynth-mcp-server"
version = "0.1.0"
description = "RepoSynth Deployment Grounding — infra verification MCP server for coding agents"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
reposynth-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
